<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The logo itself, with no plate behind it. favicon.ico carries 16, 32
         and 48px versions downscaled from the artwork, so the browser picks a
         properly resampled one instead of squashing a single image. iOS
         composites a home-screen icon onto black and imposes its own rounded
         square, so apple-touch-icon is the one place the artwork keeps its
         white ground — otherwise its navy outline would vanish. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LunchBox Connect — institutional child-nutrition operations platform"
    />
    <title>LunchBox Connect</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
