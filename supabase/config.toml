# Supabase project configuration (A1-A3 stack decisions).
# Only signups through the app are blocked before a project is linked.

project_id = "lunchbox-connect"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = []
# Accounts are created by admins (Edge Function), never public self-signup.
enable_signup = false

[auth.email]
# Sign-UP is closed on purpose: accounts are created by an admin through the
# Edge Function, never by public self-registration.
enable_signup = false
# Sign-IN must still work — every account signs in with email + password, which
# is how all nine roles reach the app. Without this the local stack answers
# "Email logins are disabled" and nobody can log in at all. Production has the
# email provider enabled in its own dashboard settings; this line makes a
# CLI-built stack match it instead of silently diverging.
enabled = true

[functions.admin-create-user]
verify_jwt = true

# Local/CI only. `supabase start` and `db reset` run these files after the
# migrations; `supabase db push` never does, so nothing here reaches a hosted
# project. Without this block the CLI has no configured seed path and
# supabase/seed.sql is silently ignored — which is exactly what happened, and
# why every service-role write failed with "permission denied for table
# institutions" on a CLI-built stack.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
