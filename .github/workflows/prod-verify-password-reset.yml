name: Production password reset (disposable account)

# WHAT THIS PROVES, AGAINST THE LIVE SITE
#
# That the Set password function works end to end in production:
#   * a new password is accepted in a FRESH browser session
#   * the OLD password is rejected, both in a browser and at the auth API
#   * the account keeps exactly the role and scope it had before
#   * no password value reaches audit_log
#
# lifecycle.spec.ts already proves this flow against a disposable local stack.
# What was never proven is the same flow against the PRODUCTION origin, because
# the authoring environment cannot reach *.supabase.co or the live site — the
# egress policy answers 403 to CONNECT. A GitHub runner can.
#
# DISPOSABLE ONLY, AND IT CREATES ITS OWN FIXTURE.
#
# This does NOT touch any of the ten simulation personas. It creates one
# account through the product's own Create account dialog, does everything to
# that account, and deactivates it at the end. Nothing pre-existing is renamed,
# reassigned, deactivated or given a new password. If the run dies halfway, the
# debris is exactly one deactivated account named ZZ VERIFY <timestamp>.
#
# CREDENTIALS — fails closed without them.
#
#   PROD_ADMIN_EMAIL     an account with account-management authority
#   PROD_ADMIN_PASSWORD  its password
#
# Use a Super Admin. The password is never echoed; only presence is printed,
# and every password this job generates is random per run. Do NOT pass these as
# workflow_dispatch inputs — dispatch inputs are recorded in the run history in
# clear text, which is exactly what a secret exists to avoid.

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Origin to verify (https, no trailing slash).'
        required: false
        default: 'https://www.lunchboxconnect.com'
        type: string
  push:
    paths: ['.github/workflows/prod-verify-password-reset.yml']

concurrency:
  group: prod-verify-password-reset
  cancel-in-progress: false

jobs:
  verify:
    name: Reset a disposable account's password on the live site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP: ${{ inputs.app_url || 'https://www.lunchboxconnect.com' }}
      SUPABASE_URL: https://llnofriwvnerntrbpehc.supabase.co
      # The publishable (anon) key. Public by definition — it ships inside the
      # deployed bundle and prod-smoke already asserts it is the right project.
      ANON_KEY: sb_publishable_HYeDJV-hSX226Skco_jjIA_NQhUcx3X
    steps:
      - uses: actions/checkout@v4

      - name: Require the admin credentials
        env:
          A_EMAIL: ${{ secrets.PROD_ADMIN_EMAIL }}
          A_PASS: ${{ secrets.PROD_ADMIN_PASSWORD }}
        run: |
          missing=0
          [ -n "$A_EMAIL" ] || { echo "::error::PROD_ADMIN_EMAIL is not set. This job exists to PROVE a production password reset; refusing to report success without doing it."; missing=1; }
          [ -n "$A_PASS" ]  || { echo "::error::PROD_ADMIN_PASSWORD is not set."; missing=1; }
          [ "$missing" -eq 0 ] || exit 1
          echo "Both credentials are present."

      - name: Refuse anything that is not an https origin
        run: |
          case "$APP" in
            https://*) ;;
            *) echo "::error::app_url must be an https origin. Got '$APP'."; exit 1;;
          esac
          case "$APP" in
            */) echo "::error::app_url must not end with a slash."; exit 1;;
          esac
          echo "Verifying $APP"

      - name: Install pnpm (from packageManager)
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Drive the reset through the live product
        env:
          A_EMAIL: ${{ secrets.PROD_ADMIN_EMAIL }}
          A_PASS: ${{ secrets.PROD_ADMIN_PASSWORD }}
        run: node .github/scripts/prod-password-reset.mjs
