name: Production Edge Function secrets (read-only)

# WHAT THIS SETTLES
#
# The release record for 0043-0047 carried exactly one unverified item:
# whether SUPABASE_SERVICE_ROLE_KEY is actually present as a function secret
# for admin-set-password and admin-set-active. Nothing in the authoring
# environment can reach *.supabase.co (the network policy answers 403 to
# CONNECT), so it was written down as "very probably present" rather than
# proven — Supabase injects that variable by default, and admin-create-user
# has been reading it in production for weeks. Very probably is not verified.
#
# HOW IT IS PROVEN WITHOUT TOUCHING ANY DATA
#
# Both functions check their environment BEFORE they check the caller:
#
#     const url        = Deno.env.get('SUPABASE_URL');
#     const serviceKey = Deno.env.get('SUPABASE_SERVICE_ROLE_KEY');
#     const anonKey    = Deno.env.get('SUPABASE_ANON_KEY');
#     if (!url || !serviceKey || !anonKey) return bad('missing server env', 500);
#
#     const token = (req.headers.get('Authorization') ?? '')...
#     if (!token) return bad('missing bearer token', 401);
#
# So an UNAUTHENTICATED POST separates the two cases exactly:
#
#   500 + "missing server env"    -> the secret is MISSING. Deployment defect.
#   401 + "missing bearer token"  -> the secret is PRESENT and the function ran.
#
# Reaching the 401 means the function booted, read all three variables, found
# all three non-empty, and only then refused the caller. That is a positive
# proof of the secret, not an inference from silence.
#
# STRICTLY READ-ONLY. Every request carries no credential and is refused before
# a single row is read or written. No account, password, audit row or setting
# is touched. There is nothing here to clean up.
#
# It runs on workflow_dispatch, and on a push that touches THIS FILE only —
# GitHub will not register workflow_dispatch for a workflow that has never run
# from a branch, which is the same 404 prod-smoke.yml and prod-browser-auth.yml
# both hit.

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/prod-verify-edge-secrets.yml']

concurrency:
  group: prod-verify-edge-secrets
  cancel-in-progress: true

jobs:
  probe:
    name: Prove the service-role secret is present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Not a secret: the project ref is embedded in the deployed bundle and is
      # already asserted by prod-smoke. Kept literal so this probe cannot be
      # quietly retargeted by an unrelated settings change.
      PROJECT_REF: llnofriwvnerntrbpehc
    steps:
      - name: Probe admin-set-password and admin-set-active unauthenticated
        run: |
          set -uo pipefail
          fail=0

          for fn in admin-set-password admin-set-active; do
            url="https://${PROJECT_REF}.supabase.co/functions/v1/${fn}"
            echo "──────────────────────────────────────────────────────────"
            echo "POST $url   (no Authorization header, empty JSON body)"

            body=$(mktemp)
            code=$(curl -sS -o "$body" -w '%{http_code}' \
                     -X POST "$url" \
                     -H 'Content-Type: application/json' \
                     --data '{}' \
                     --max-time 30) || code=000
            payload=$(cat "$body")

            echo "HTTP $code"
            echo "body: $payload"

            case "$code" in
              401)
                if echo "$payload" | grep -q 'missing bearer token'; then
                  echo "::notice title=$fn::PRESENT — function booted, read all three env vars, then refused the caller (401 missing bearer token)"
                else
                  echo "::error title=$fn::401 but not the expected refusal. Body: $payload"
                  fail=1
                fi
                ;;
              500)
                if echo "$payload" | grep -q 'missing server env'; then
                  echo "::error title=$fn::SUPABASE_SERVICE_ROLE_KEY (or SUPABASE_URL / SUPABASE_ANON_KEY) is MISSING for $fn. Set it with: supabase secrets set SUPABASE_SERVICE_ROLE_KEY=... --project-ref $PROJECT_REF"
                else
                  echo "::error title=$fn::500 from $fn for another reason. Body: $payload"
                fi
                fail=1
                ;;
              000)
                echo "::error title=$fn::the request did not complete (network/timeout). This proves nothing; re-run."
                fail=1
                ;;
              *)
                echo "::error title=$fn::unexpected HTTP $code. A probe that does not reach the env check tests nothing. Body: $payload"
                fail=1
                ;;
            esac
          done

          echo "──────────────────────────────────────────────────────────"
          if [ "$fail" -ne 0 ]; then
            echo "::error::Edge Function secret verification FAILED."
            exit 1
          fi
          echo "Both functions are operational and hold their server environment."

      - name: Confirm the preflight is answered
        run: |
          set -uo pipefail
          # verify_jwt is false for both, precisely so the CORS preflight — which
          # carries no Authorization header — is not rejected by the platform
          # before the function runs. A browser cannot call them otherwise.
          fail=0
          for fn in admin-set-password admin-set-active; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
                     -X OPTIONS "https://${PROJECT_REF}.supabase.co/functions/v1/${fn}" \
                     -H 'Origin: https://www.lunchboxconnect.com' \
                     -H 'Access-Control-Request-Method: POST' \
                     -H 'Access-Control-Request-Headers: authorization, content-type' \
                     --max-time 30) || code=000
            echo "$fn OPTIONS -> HTTP $code"
            if [ "$code" != "200" ] && [ "$code" != "204" ]; then
              echo "::error title=$fn::CORS preflight answered $code. The browser could not call this function."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "Both functions answer the browser preflight."
