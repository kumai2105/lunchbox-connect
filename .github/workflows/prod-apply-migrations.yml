name: Production apply — migrations and Edge Functions

# APPLIES SCHEMA TO THE LIVE DATABASE. Read this before dispatching it.
#
# WHY THIS EXISTS
#
# Migrations 0043–0046 are verified (run 32643257414: 100/100 browser tests,
# 23 SQL suites, 280 assertions, replayed from nothing on a throwaway
# PostgreSQL 16) and production is still at 0042. The authoring environment
# cannot reach Supabase at all — the network policy answers 403 to CONNECT for
# *.supabase.co and api.supabase.com — so the apply has to happen somewhere
# that can. This is that place.
#
# THE ORDER IS NOT NEGOTIABLE: migrations → Edge Functions → frontend.
#
# The frontend reads columns and calls functions a lagging backend does not
# have, and the failure is SILENT rather than loud: `app_users.active` and
# `institutions.active` do not exist at 0042, `select *` returns rows without
# them, `undefined` is falsy, and every account would render as "Deactivated"
# and every institution as "Archived" on the live site. Do not deploy the
# frontend until this job has succeeded.
#
# WHAT RUNS WHEN
#
#   push (this file only)  — PREFLIGHT ONLY. Proves the credentials exist,
#                            reads the live migration ledger, and captures a
#                            recovery point. Applies NOTHING. Registering the
#                            workflow this way is how every dispatchable
#                            workflow in this repository got registered, and a
#                            push trigger that silently mutated production
#                            would be indefensible.
#   workflow_dispatch      — preflight, then apply, but ONLY when `confirm`
#                            is the project ref typed out in full.
#
# CREDENTIALS — two repository secrets, and the job FAILS CLOSED without them:
#
#   SUPABASE_ACCESS_TOKEN   a personal access token (Supabase dashboard →
#                           Account → Access Tokens). Used to link the project
#                           and to deploy functions.
#   SUPABASE_DB_PASSWORD    the project's database password. Used by
#                           `supabase db push`.
#
# Neither is ever echoed. Only their presence is ever printed.

on:
  push:
    paths: ['.github/workflows/prod-apply-migrations.yml']
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the project ref exactly to apply. Anything else runs preflight only.'
        required: true
        default: ''
        type: string
      deploy_functions:
        description: 'Also deploy admin-create-user, admin-set-password and admin-set-active.'
        required: false
        default: true
        type: boolean

concurrency:
  group: prod-apply-migrations
  cancel-in-progress: false

env:
  PROJECT_REF: llnofriwvnerntrbpehc

jobs:
  apply:
    name: Apply pending migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Record the exact tree being applied
        run: |
          echo "commit    : $(git rev-parse HEAD)"
          echo "migrations: $(ls supabase/migrations/*.sql | wc -l) files"
          echo "ceiling   : $(ls supabase/migrations/*.sql | sed 's#.*/##' | sort | tail -1)"

      - name: Require the credentials
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DBPASS: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          missing=0
          [ -n "$TOKEN" ]  || { echo "::error::SUPABASE_ACCESS_TOKEN is not set. Create one at Supabase → Account → Access Tokens and add it as a repository secret."; missing=1; }
          [ -n "$DBPASS" ] || { echo "::error::SUPABASE_DB_PASSWORD is not set. It is the database password for project $PROJECT_REF."; missing=1; }
          [ "$missing" -eq 0 ] || exit 1
          echo "Both credentials are present."

      # Same authenticated resolution as the E2E gate: an unauthenticated call
      # to a third party's release API is not a dependable step in a release.
      - name: Resolve the Supabase CLI version (authenticated)
        id: cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            TAG=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                    https://api.github.com/repos/supabase/cli/releases/latest | jq -r '.tag_name // empty') || TAG=""
            [ -n "$TAG" ] && break
            sleep $((attempt * 5))
          done
          [ -n "$TAG" ] || { echo "::error::Could not resolve a Supabase CLI release after 5 attempts."; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ steps.cli.outputs.version }}

      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$PROJECT_REF"

      # ---------------------------------------------------------------- PREFLIGHT
      - name: PREFLIGHT · what production has, and what is pending
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "===== migration ledger: LOCAL vs REMOTE ====="
          supabase migration list | tee /tmp/ledger-before.txt
          echo "============================================="
          # The ledger prints local and remote columns side by side. A row with
          # a local version and no remote one is pending.
          echo "Rows above with a LOCAL version and an empty REMOTE column are what this job would apply."

      - name: PREFLIGHT · capture a recovery point BEFORE anything changes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          mkdir -p recovery-artifact
          # The public schema as it stands right now: every table definition,
          # every policy, and the full body of each of the eleven authorization
          # helpers that 0044 reissues. That is what makes 0044 reversible
          # without a data dump — it replaces those functions, and this is the
          # previous text of each.
          supabase db dump --schema public -f recovery-artifact/pre-apply-public-schema.sql
          supabase db dump --schema auth   -f recovery-artifact/pre-apply-auth-schema.sql || \
            echo "::warning::auth schema dump unavailable; the public dump is the one that matters here."
          cp /tmp/ledger-before.txt recovery-artifact/ledger-before.txt
          {
            echo "# Recovery point — production $PROJECT_REF"
            echo
            echo "Captured $(date -u +%Y-%m-%dT%H:%M:%SZ) by workflow run ${{ github.run_id }},"
            echo "immediately before applying the migrations pending at commit $(git rev-parse HEAD)."
            echo
            echo "pre-apply-public-schema.sql is the schema as it stood BEFORE the apply,"
            echo "including the previous body of every authorization helper that 0044 reissues."
            echo "It is a schema dump, NOT a data dump, and is not a substitute for one."
            echo "Supabase's own managed backup / PITR state for this project was not verified"
            echo "by this job."
          } > recovery-artifact/README.md
          ls -la recovery-artifact/
          wc -l recovery-artifact/*.sql

      - name: Upload the recovery point
        uses: actions/upload-artifact@v4
        with:
          name: production-recovery-point-${{ github.run_id }}
          path: recovery-artifact/
          retention-days: 90

      - name: Decide whether this run applies anything
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PREFLIGHT ONLY — this run was triggered by a push, which never mutates production. The ledger and recovery point above are the whole output. Dispatch the workflow with confirm=$PROJECT_REF to apply."
          elif [ "${{ inputs.confirm }}" = "$PROJECT_REF" ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
            echo "Confirmation matches. Applying."
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "::error::confirm did not match the project ref. Nothing was applied. Type '$PROJECT_REF' exactly."
            exit 1
          fi

      # ---------------------------------------------------------------- APPLY
      # APPLY — one file at a time, through the Management API.
      #
      # NOT `supabase db push`. That refuses on this project, and it is right
      # to: every migration this database has ever received was applied through
      # the Management API, which records the ledger row as a TIMESTAMP version
      # carrying the file's name (20260823172428 / 0043_meal_period_tags). The
      # CLI derives its version from the filename prefix instead — 0043 — so it
      # finds fifty remote versions it has no local file for and stops.
      #
      # Its suggested remedy is to mark all fifty `reverted` and push
      # everything. On a live database that would replay 0001-0047 against a
      # schema that already has them. It is the wrong instruction here, and it
      # is offered without knowing that.
      #
      # So this continues the pattern that produced every existing row rather
      # than rewriting the ledger to suit a tool this project never used:
      # apply the file, record it, in order, stopping at the first error.
      # Additive only — no existing ledger row is read back except to skip
      # what is already applied.
      - name: APPLY · each pending migration, then record it
        if: steps.gate.outputs.apply == 'true'
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"

          run_sql() {
            local sql="$1" label="$2" code
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data "$(jq -Rn --arg q "$sql" '{query:$q}')")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::$label failed with HTTP $code"
              cat /tmp/resp.json
              exit 1
            fi
          }

          run_sql "select version, name from supabase_migrations.schema_migrations order by version;" "read ledger"
          APPLIED=$(jq -r '.[].name' /tmp/resp.json)
          echo "ledger holds $(echo "$APPLIED" | wc -l) rows; last: $(echo "$APPLIED" | tail -1)"

          for f in supabase/migrations/*.sql; do
            NAME=$(basename "$f" .sql)
            if echo "$APPLIED" | grep -qx "$NAME"; then continue; fi
            echo "----- applying $NAME -----"
            # One transaction per file: a migration that fails half way leaves
            # nothing behind to reason about later.
            run_sql "$(printf 'begin;\n%s\ncommit;' "$(cat "$f")")" "apply $NAME"
            VERSION=$(date -u +%Y%m%d%H%M%S)
            run_sql "insert into supabase_migrations.schema_migrations (version, name)
                     values ('$VERSION', '$NAME');" "record $NAME"
            echo "recorded $NAME as $VERSION"
            sleep 1
          done

      - name: VERIFY · the objects exist, not merely the ledger rows
        if: steps.gate.outputs.apply == 'true'
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          ask() {
            curl -sS -X POST "$API" -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -Rn --arg q "$1" '{query:$q}')"
          }

          echo "===== ledger AFTER (last 8) ====="
          ask "select version, name from supabase_migrations.schema_migrations order by version;" \
            | jq -r '.[] | "\(.version)  \(.name)"' | tail -8

          # A ledger row is a claim about the database. These are the database.
          echo "===== objects ====="
          ask "select to_regclass('public.meal_plans')::text         as meal_plans,
                      to_regclass('public.student_meal_plans')::text as student_meal_plans,
                      to_regclass('public.final_demand')::text       as final_demand,
                      to_regclass('public.delivery_manifests')::text as delivery_manifests,
                      to_regclass('public.operational_days')::text   as operational_days;" \
            | tee /tmp/objects.json
          if jq -e '.[0] | to_entries | map(select(.value == null)) | length > 0' /tmp/objects.json >/dev/null; then
            echo "::error::Something the spine needs is missing after the apply. Do NOT deploy the frontend."
            exit 1
          fi
          echo "Every object the release requires is present."

      # ------------------------------------------------------- EDGE FUNCTIONS
      - name: Are the function secrets in place?
        if: steps.gate.outputs.apply == 'true' && inputs.deploy_functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Prints NAMES and digests, never values.
          supabase secrets list --project-ref "$PROJECT_REF" || true
          echo "::notice::All three functions need SUPABASE_SERVICE_ROLE_KEY as a function secret. If it is not listed above, set it with 'supabase secrets set SUPABASE_SERVICE_ROLE_KEY=...' before relying on them. That key must exist ONLY in the function environment, never in a frontend build."

      - name: DEPLOY · the three privileged functions
        if: steps.gate.outputs.apply == 'true' && inputs.deploy_functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # All three, or the actions that depend on them fail in a browser
          # with a 404 that looks like a product bug.
          supabase functions deploy admin-create-user  --project-ref "$PROJECT_REF"
          supabase functions deploy admin-set-password --project-ref "$PROJECT_REF"
          supabase functions deploy admin-set-active   --project-ref "$PROJECT_REF"

      - name: What to do next
        if: steps.gate.outputs.apply == 'true'
        run: |
          CEILING=$(ls supabase/migrations/*.sql | sed 's#.*/##' | sort | tail -1 | cut -d_ -f1)
          echo "::notice::Backend is now at $CEILING. Set BACKEND_READY_MIGRATION=$CEILING, then dispatch 'Deploy to Cloudflare' on commit ${{ github.sha }} — the SAME commit the browser gate ran against — and then prod-smoke and prod-browser-auth on it."
