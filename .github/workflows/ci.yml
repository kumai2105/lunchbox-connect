name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---- always runs on every PR: typecheck, lint, unit -------------------------
  gate:
    name: Typecheck · lint · unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm (from packageManager)
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

  # ---- gate output: whether the E2E secrets exist. Job-level `if:` cannot
  # reference `secrets` directly (GitHub rejects it at parse time), so the
  # check has to happen inside a step and be threaded through as a job output.
  check-e2e-secrets:
    name: Check E2E secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          E2E_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$E2E_URL" ] && [ -n "$E2E_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  # -----------------------------------------------------------------------------
  # E2E — runs ONLY when the live-Supabase credentials exist as repository
  # secrets AND the PR is from the same repo (GitHub never exposes secrets to
  # fork PRs; the job is skipped there by design, matching the suite's
  # BLOCKED_BY_ENVIRONMENT rule). Browser install is cached so re-runs skip it.
  # -----------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright · live Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gate, check-e2e-secrets]
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.check-e2e-secrets.outputs.ready == 'true'
    env:
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm (from packageManager)
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Install Playwright browser (chromium + deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the frontend
        run: pnpm build

      - name: Serve app + run E2E
        run: |
          pnpm preview --host 127.0.0.1 --port 4173 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:4173 >/dev/null && break
            sleep 1
          done
          pnpm test:e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
