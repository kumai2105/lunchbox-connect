name: Deploy to Cloudflare

# RELEASE-SAFE (item 10): a production deploy is an explicit release action, not
# a side effect of pushing a branch. It fires ONLY on:
#   • a manual `workflow_dispatch` (a human clicks "Run workflow"), or
#   • pushing a version tag `v*` (a deliberate release cut).
# Pushing the development branch — including `claude/new-session-k5dd5u` — no
# longer deploys anything. And even on a real release trigger, the deploy runs
# only after non-network build gates (typecheck · lint · unit · build) pass in
# the same job, so a broken tree cannot reach production. Production E2E is
# intentionally NOT part of this gate: seeded E2E must never run against the
# production Supabase project (see CI item 8), so it stays out of the release
# path.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm (from packageManager)
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---- release gate: fail the deploy before any build/publish if the tree
      # does not pass the same non-network checks CI enforces. These need no
      # network and no Supabase project, so they are safe in the release path.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Build the frontend
        env:
          # The Supabase anon key is public-by-design (RLS enforces access, not
          # secrecy — see .env.example) and ships inside the built JS bundle
          # regardless of how it's deployed, so it is not a GitHub secret.
          VITE_SUPABASE_URL: https://llnofriwvnerntrbpehc.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxsbm9mcml3dm5lcm50cmJwZWhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNDUwNjAsImV4cCI6MjEwMjYyMTA2MH0.aE04Weq-Yu2ElnjxZS-JUIGDdC33tArSReeSjYhObYo
        run: pnpm build

      - name: Check Cloudflare secrets are configured
        # `secrets` cannot appear in ANY if: expression (job or step —
        # GitHub rejects both at parse time). Read it only inside a run:
        # script via env:, then expose a plain step output for if: to use.
        id: cf-check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets are not set yet — skipping deploy."
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.cf-check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
