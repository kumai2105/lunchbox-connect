name: Deploy to Cloudflare

# RELEASE-SAFE (item 10): a production deploy is an explicit release action, not
# a side effect of pushing a branch. It fires ONLY on:
#   • a manual `workflow_dispatch` (a human clicks "Run workflow"), or
#   • pushing a version tag `v*` (a deliberate release cut).
# Pushing the development branch — including `claude/new-session-k5dd5u` — no
# longer deploys anything. And even on a real release trigger, the deploy runs
# only after non-network build gates (typecheck · lint · unit · build) pass in
# the same job, so a broken tree cannot reach production. Production E2E is
# intentionally NOT part of this gate: seeded E2E must never run against the
# production Supabase project (see CI item 8), so it stays out of the release
# path.
on:
  workflow_dispatch:
    inputs:
      backend_ready_migration:
        description: >-
          Highest migration version ALREADY APPLIED to production (e.g. 0038).
          Attests that PRODUCTION_APPLY.md steps 1-5 are complete for this
          release. The deploy refuses to run without it.
        required: true
        type: string
  push:
    tags: ['v*']

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm (from packageManager)
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---- release gate: fail the deploy before any build/publish if the tree
      # does not pass the same non-network checks CI enforces. These need no
      # network and no Supabase project, so they are safe in the release path.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      # ---- BACKEND READINESS GATE (item 20) -------------------------------
      #
      # A v* tag or a manual run could previously ship a frontend against an
      # older backend. The architecture couples
      #     database schema  ->  admin-create-user Edge Function  ->  frontend
      # because the bundle calls RPCs, tables and a function that must already
      # exist. A release is a SEQUENCE, not a single button.
      #
      # This step refuses to continue unless the operator has confirmed, for
      # THIS release, that steps 1-5 of scripts/PRODUCTION_APPLY.md are done:
      #   1. inspect the production migration ledger
      #   2. preflight migration blockers
      #   3. apply only the missing approved migrations
      #   4. deploy/configure admin-create-user
      #   5. verify backend / Auth / Edge Function readiness
      #
      # It is a human attestation naming the applied migration, not an
      # automatic production mutation: nothing here touches production data,
      # and seeded production E2E is deliberately NOT part of the gate.
      - name: Backend readiness gate
        env:
          # Set per release: the highest migration version applied to production.
          BACKEND_READY_MIGRATION: ${{ inputs.backend_ready_migration || vars.BACKEND_READY_MIGRATION }}
        run: |
          LATEST=$(ls supabase/migrations/*.sql | sed 's#.*/##' | sort | tail -1 | cut -d_ -f1)
          echo "Frontend in this release expects migrations through: $LATEST"
          if [ -z "$BACKEND_READY_MIGRATION" ]; then
            echo "::error::Backend readiness not attested. Follow scripts/PRODUCTION_APPLY.md steps 1-5, then set BACKEND_READY_MIGRATION (repository variable, or the workflow_dispatch input) to the highest migration version applied to production — e.g. $LATEST. Refusing to deploy a frontend against an unverified backend."
            exit 1
          fi
          if [ "$BACKEND_READY_MIGRATION" \< "$LATEST" ]; then
            echo "::error::Production is attested at migration $BACKEND_READY_MIGRATION but this frontend expects $LATEST. Apply the missing migrations and redeploy the Edge Function first (scripts/PRODUCTION_APPLY.md). Refusing to deploy."
            exit 1
          fi
          echo "Backend attested at $BACKEND_READY_MIGRATION (>= $LATEST required). Proceeding."

      - name: Build the frontend
        env:
          # The Supabase anon key is public-by-design (RLS enforces access, not
          # secrecy — see .env.example) and ships inside the built JS bundle
          # regardless of how it's deployed, so it is not a GitHub secret.
          VITE_SUPABASE_URL: https://llnofriwvnerntrbpehc.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxsbm9mcml3dm5lcm50cmJwZWhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNDUwNjAsImV4cCI6MjEwMjYyMTA2MH0.aE04Weq-Yu2ElnjxZS-JUIGDdC33tArSReeSjYhObYo
        run: pnpm build

      # ---- DEPLOY CREDENTIALS: FAIL CLOSED ---------------------------------
      #
      # This step used to emit `::warning::` and set `ready=false`, and the
      # deploy step below was gated on `if: ready == 'true'`. A skipped step
      # does not fail a job — so a release run with no Cloudflare credentials
      # finished GREEN having deployed nothing. On an explicit production
      # release action, a green check that shipped nothing is worse than a red
      # one: it is a false statement about the state of production.
      #
      # A missing credential is now a hard failure. Note this changes nothing
      # about WHEN the workflow runs: the triggers above are still an explicit
      # `workflow_dispatch` or a `v*` tag, so an ordinary branch push still
      # deploys nothing at all.
      #
      # `secrets` cannot appear in ANY if: expression (job or step — GitHub
      # rejects both at parse time), so they are read inside a run: script via
      # env:. Only presence is ever printed; the values are never echoed.
      - name: Require Cloudflare deploy credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. This is an explicit production release; refusing to report success without deploying. Add the repository secret and re-run."
            missing=1
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set. This is an explicit production release; refusing to report success without deploying. Add the repository secret and re-run."
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1
          echo "Cloudflare credentials present. Proceeding to deploy."

      # No `if:` guard. The step always runs, so a wrangler failure fails the
      # job instead of being quietly stepped over.
      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Belt and braces: assert the deploy actually EXECUTED and succeeded, so
      # that re-introducing an `if:` on the step above cannot silently restore
      # the "green run that shipped nothing" behaviour this workflow just lost.
      - name: Confirm the deploy actually ran
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          if [ "$DEPLOY_OUTCOME" != "success" ]; then
            echo "::error::The Cloudflare deploy step did not succeed (outcome: '${DEPLOY_OUTCOME:-skipped}'). A successful run of this workflow MUST mean the frontend was deployed."
            exit 1
          fi
          echo "Frontend deploy step executed and succeeded."
